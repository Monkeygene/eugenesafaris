    <meta property="og:title" content="Eugene Safaris | Safaris in Kruger National Park" />
    <meta
      property="og:description"
      content="Guided wildlife experiences in Kruger National Park with Eugene Safaris, including private safaris, birding tours, and photographic safaris."

  <body class="antialiased">
    <!-- #region Navbar -->
    <header class="absolute inset-x-0 top-0 z-50 h-24">
      <nav
        class="mx-auto grid h-full max-w-[1600px] grid-cols-[1fr_auto_1fr] items-center px-6 md:px-10"
        aria-label="Main"
      >
        <!-- Left: hamburger / close toggle -->
        <button
          id="menu-toggle"
          type="button"
          class="col-start-3 row-start-1 justify-self-end rounded-md p-2 text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white transition-transform duration-150 hover:scale-105 active:scale-95 md:col-start-1 md:justify-self-start lg:cursor-pointer"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="side-menu"
        >
          <img
            id="menu-icon"
            src="/images/navbar/hamburger-closed.svg"
            data-closed="/images/navbar/hamburger-closed.svg"
            data-open="/images/navbar/hamburger-open.svg"
            alt=""
            class="h-7 lg:h-8 w-auto transition-transform duration-150"
          />
        </button>

        <!-- Center: logo -->
        <a
          href="/"
          class="col-start-2 row-start-1 justify-self-center focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white"
          aria-label="Home"
        >
          <img src="/images/navbar/eugenesafaris.svg" alt="Your brand" class="h-9 lg:h-10 w-auto max-w-none" />
        </a>

        <!-- Right: support button -->

        <div class="col-start-3 row-start-1 hidden justify-self-end relative md:block">
          <a href="/contact/" class="group relative inline-block">
            <span class="sr-only">contact</span>
            <img
              src="/images/navbar/contact-eugenesafaris.svg"
              alt=""
              class="w-full max-w-md h-4"
              loading="lazy"
              aria-hidden="true"
            />
            <!-- Custom Hover Line -->
            <img
              src="/images/navbar/contact-eugenesafaris-hover.svg"
              alt=""
              class="absolute left-1/2 -translate-x-1/2 -bottom-2 w-full opacity-0 group-hover:opacity-100 transition-opacity duration-200"
              loading="lazy"
              aria-hidden="true"
              decoding="async"
            />
          </a>
        </div>
      </nav>
    </header>

    <!-- Dim overlay: sits under the header, over the page -->
    <div
      id="menu-overlay"
      class="pointer-events-none fixed inset-0 z-30 bg-black/30 opacity-0 transition-opacity duration-300 motion-reduce:transition-none data-open:pointer-events-auto data-open:opacity-100"
      aria-hidden="true"
    ></div>

    <!-- Side menu: slides in from the left, under the header so the toggle stays visible -->
    <aside
      id="side-menu"
      inert
      class="fixed inset-y-0 left-0 z-40 w-[85%] max-w-sm -translate-x-full bg-linen pt-25 shadow-2xl transition-transform duration-300 ease-out motion-reduce:transition-none max-md:left-auto max-md:right-0 max-md:translate-x-full data-open:translate-x-0"

    >

        <li>

          >
        </li>
        <li>
          <a
            href="/kruger-national-park/bird-watching-safari/"

          >
        </li>
        <li>

            href="/kruger-national-park/photographic-safari/"
            class="block rounded-md px-2 py-3 text-2xl font-medium text-black transition-colors hover:text-mist-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"

        <li>
          <a
            href="/kruger-national-park/"
            class="block rounded-md px-2 py-3 text-2xl font-medium text-black transition-colors hover:text-mist-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"

          >
        </li>
        <li>
          <a
            href="/about/"
            class="block rounded-md px-2 py-3 text-2xl font-medium text-black transition-colors hover:text-mist-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"

          >
        </li>
        <li>
          <a
            href="/contact/"
            class="block rounded-md px-2 py-3 text-2xl font-medium text-black transition-colors hover:text-mist-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"

          >
        </li>
      </ul>
    </aside>
    <!-- #endregion -->
    <main class="pt-24"></main>
    <script type="module" src="/src/main.js"></script>

</html>
