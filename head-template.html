<!doctype html>
<html lang="en">
  <head>
    <!-- Essentials (keep first) -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ PAGE TITLE }} | Eugene Safaris</title>
    <meta name="description" content="{{ 140–160 character description unique to this page }}" />
    <link rel="canonical" href="https://eugenesafaris.com{{ /path/ }}" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="{{ #hexOfBrandColour }}" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/images/logo/paw-print-lion.png" type="image/png" />
    <link rel="apple-touch-icon" href="/images/logo/apple-touch-icon-180.png" />

    <!-- Preload: only what is visible on first paint -->
    <link
      rel="preload"
      href="/fonts/barlow/barlow-condensed-v13-latin-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/crimson/CrimsonText-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/images/navbar/hamburger-closed.svg" as="image" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eugene Safaris" />
    <meta property="og:title" content="{{ same as title, or a punchier version }}" />
    <meta property="og:description" content="{{ same as meta description }}" />
    <meta property="og:url" content="https://eugenesafaris.com{{ /path/ }}" />
    <meta property="og:image" content="https://eugenesafaris.com/images/social/{{ page-image }}.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ describe the image }}" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ same as og:title }}" />
    <meta name="twitter:description" content="{{ same as og:description }}" />
    <meta name="twitter:image" content="https://eugenesafaris.com/images/social/{{ page-image }}.jpg" />

    <!-- Structured data: breadcrumbs -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://eugenesafaris.com/" },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "{{ Page name }}",
            "item": "https://eugenesafaris.com{{ /path/ }}"
          }
        ]
      }
    </script>
  </head>
</html>
